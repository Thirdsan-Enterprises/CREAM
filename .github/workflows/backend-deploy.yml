name: Backend · Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Package release
        run: |
          tar czf ../release.tar.gz \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='storage' \
            --exclude='tests' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            .

      - name: Upload release to DirectAdmin
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DA_HOST }}
          username: ${{ secrets.DA_USER }}
          key: ${{ secrets.DA_SSH_KEY }}
          port: ${{ secrets.DA_PORT }}
          source: 'release.tar.gz'
          target: '/tmp'

      - name: Extract and finalize on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DA_HOST }}
          username: ${{ secrets.DA_USER }}
          key: ${{ secrets.DA_SSH_KEY }}
          port: ${{ secrets.DA_PORT }}
          script: |
            set -e
            APP_DIR="${{ secrets.DA_APP_DIR }}"
            PHP_BIN="${{ secrets.DA_PHP_BIN }}"
            mkdir -p "$APP_DIR/storage/framework/cache" \
                     "$APP_DIR/storage/framework/sessions" \
                     "$APP_DIR/storage/framework/views" \
                     "$APP_DIR/storage/logs" \
                     "$APP_DIR/bootstrap/cache"
            tar xzf /tmp/release.tar.gz -C "$APP_DIR"
            rm -f /tmp/release.tar.gz
            cd "$APP_DIR"
            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache
            "$PHP_BIN" artisan view:cache
            "$PHP_BIN" artisan storage:link || true

      # Migrations run with the CLI PHP, which can differ from the PHP the
      # website runs on — a mismatch once left every request (login
      # included) returning 500 while this workflow stayed green. Hit the
      # live health endpoint so a broken site fails the deploy instead.
      - name: Check the live API responds
        env:
          HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://cream.ambozygraphics.com/up' }}
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /tmp/health.txt -w '%{http_code}' "$HEALTH_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Live API is healthy ($HEALTH_URL)"
              exit 0
            fi
            echo "Attempt $attempt: $HEALTH_URL returned $status"
            sleep 6
          done
          echo "::error::Live API is not healthy after deploy. Response:"
          head -c 1000 /tmp/health.txt
          exit 1
